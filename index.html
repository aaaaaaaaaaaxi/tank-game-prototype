<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tank Game</title>
</head>
<body>
    <h1>Tank Game</h1>
    <canvas id="gameCanvas" width="800" height="600" style="background-color: lightgray; border: 1px solid black;"></canvas>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let tankX = 100;
        let tankY = 100;
        let turretAngle = 0;

        const keys = { w: false, a: false, s: false, d: false };
        const bullets = [];

        function shoot() {
            const barrelLength = 20;
            const muzzleX = tankX + Math.cos(turretAngle) * barrelLength;
            const muzzleY = tankY + Math.sin(turretAngle) * barrelLength;
            const bulletSpeed = 10;
            bullets.push({
                x: muzzleX,
                y: muzzleY,
                velocityX: Math.cos(turretAngle) * bulletSpeed,
                velocityY: Math.sin(turretAngle) * bulletSpeed
            });
        }

        function updateGame() {
            if (keys.w) tankY -= 5;
            if (keys.s) tankY += 5;
            if (keys.a) tankX -= 5;
            if (keys.d) tankX += 5;

            tankX = Math.max(0, Math.min(canvas.width, tankX));
            tankY = Math.max(0, Math.min(canvas.height, tankY));

            for (let i = bullets.length - 1; i >= 0; i--) {
                const b = bullets[i];
                b.x += b.velocityX;
                b.y += b.velocityY;

                if (b.x < 0 || b.x > canvas.width || b.y < 0 || b.y > canvas.height) {
                    bullets.splice(i, 1);
                }
            }
        }

        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawTank(ctx, tankX, tankY, turretAngle);

            ctx.fillStyle = 'yellow';
            for (const b of bullets) {
                ctx.beginPath();
                ctx.arc(b.x, b.y, 5, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;
            turretAngle = Math.atan2(mouseY - tankY, mouseX - tankX);
        });

        window.addEventListener('keydown', (e) => {
            const k = e.key.toLowerCase();
            if (k in keys) {
                keys[k] = true;
            }

            if (e.code === 'Space' && !e.repeat) {
                shoot();
            }
        });

        window.addEventListener('keyup', (e) => {
            const k = e.key.toLowerCase();
            if (k in keys) keys[k] = false;
        });

        function gameLoop() {
            updateGame();
            render();
            requestAnimationFrame(gameLoop);
        }

        function drawTank(ctx, x, y, angle) {
            // 1. Tank body: pink rectangle 40x20, centered at (x, y)
            ctx.fillStyle = 'pink';
            ctx.fillRect(x - 20, y - 10, 40, 20);

            // 2 & 3. Turret + barrel rotate toward mouse
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(angle);

            ctx.fillStyle = 'deeppink';
            ctx.fillRect(-15, -5, 30, 10);

            ctx.strokeStyle = 'black';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(20, 0);
            ctx.stroke();

            ctx.restore();
        }

        gameLoop();
    </script>
</body>
</html>
